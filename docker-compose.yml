services:
  gh-rss-service:
    build: .
    image: ghcr.io/tehpegasus/gh-rss-service:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
    volumes:
      - ./gh-rss-data:/data
